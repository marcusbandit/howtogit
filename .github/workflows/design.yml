name: design

on:
  pull_request:
  push:
    branches: [main]

jobs:
  type-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Font sizes, weights and families follow design/README.md
        run: node scripts/check-design.mjs
