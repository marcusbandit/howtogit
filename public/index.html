<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>howtogit — learn git on paper</title>
  <meta name="description" content="An interactive, hand-drawn guide to git for beginners — type real commands and watch the graph get drawn for you." />
  <meta name="color-scheme" content="light" />

  <meta property="og:title" content="howtogit — learn git on paper" />
  <meta property="og:description" content="Type real git commands and watch the graph get drawn for you, by hand." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://howtogit.dev/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css?v=editor14" />
</head>
<body>
  <!-- paper grain: real fractal noise, kept faint -->
  <svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#paper-grain)" />
  </svg>

  <header class="brand">
    <span class="brand__word">howtogit.dev</span>
    <svg class="brand__rule" aria-hidden="true" viewBox="0 0 160 12" preserveAspectRatio="none"></svg>
  </header>

  <div class="wip" aria-label="work in progress">work in progress</div>

  <!-- a simplified project on disk; git init adds the .git folder -->
  <aside id="filetree" class="tree" aria-label="project files">
    <p class="tree__title">on your computer</p>
    <ul class="tree__list" id="tree-list"></ul>
  </aside>

  <!-- the remote repo, revealed by git remote add and filled by git push -->
  <aside id="remotetree" class="tree tree--remote" aria-label="remote repository">
    <p class="tree__title">the remote</p>
    <ul class="tree__list" id="remote-list"></ul>
  </aside>

  <!-- the laptop (second machine): its home folder ~/ appears when we move to it
       (git clone onward), and my-site/ lands inside after the clone. -->
  <aside id="laptoptree" class="tree tree--laptop" aria-label="laptop files" aria-hidden="true">
    <p class="tree__title">on your laptop</p>
    <ul class="tree__list" id="laptop-list"></ul>
  </aside>

  <!-- the infinite board where the graph gets drawn -->
  <main id="board" aria-label="git graph">
    <svg id="graph" aria-hidden="true">
      <defs>
        <!-- the living "boil": animated displacement makes strokes feel hand-drawn -->
        <filter id="boil" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="1" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
      <!-- the remote's own tree: a copy of the trunk floats up here on push and
           shrinks into a simplified mini-graph. Outer group pans with the board;
           inner group carries the float-up + shrink transform. -->
      <g id="remote-graph" filter="url(#boil)"><g id="remote-graph-inner"></g></g>
      <!-- a small grayed copy of the desktop's graph, parked beside the stowed
           desktop tree once we have moved to the laptop. Never panned. -->
      <g id="mini-desktop" filter="url(#boil)"><g id="mini-desktop-inner"></g></g>
      <g id="edges" filter="url(#boil)"></g>
      <g id="nodes" filter="url(#boil)"></g>
      <g id="ink-nib"></g>
      <g id="labels"></g>
      <!-- the laptop's own graph layers: the board switches to these when we
           move to the second machine (clone onward). Empty until then. -->
      <g id="lap-edges" filter="url(#boil)"></g>
      <g id="lap-nodes" filter="url(#boil)"></g>
      <g id="lap-ink-nib"></g>
      <g id="lap-labels"></g>
    </svg>
  </main>

  <!-- a make-believe code editor: on the feature branch it opens, types an edit
       into index.html, then saves. Purely a visual beat, nothing functional. -->
  <div id="editor" class="editor" aria-hidden="true">
    <div class="editor__bar">
      <span class="editor__dots"><i></i><i></i><i></i></span>
      <span class="editor__name"><span id="editor-name">index.html</span><b class="editor__unsaved" id="editor-unsaved">●</b></span>
      <span class="editor__save" id="editor-save">saved ✓</span>
    </div>
    <div class="editor__code" id="editor-code"></div>
  </div>

  <!-- the command line + lesson: starts centered, settles downward after init -->
  <section id="stage" class="is-centered" aria-live="polite">
    <div class="lesson" id="lesson">
      <p class="lesson__goal" id="goal"></p>
      <p class="lesson__why" id="why"></p>
      <p class="lesson__note" id="note" hidden></p>
      <div class="lesson__parts" id="parts"></div>
    </div>
    <form id="cli" autocomplete="off" spellcheck="false">
      <span class="cli__field">
        <span class="cli__ink" id="ink" aria-hidden="true"></span>
        <input id="cmd" name="cmd" type="text" inputmode="text" autocapitalize="none"
               autocorrect="off" aria-label="git command" />
        <svg class="cli__rule" aria-hidden="true" viewBox="0 0 100 10" preserveAspectRatio="none"></svg>
        <span class="cli__tab" id="tabhint" aria-hidden="true">⇥ tab to finish the line</span>
      </span>
    </form>
    <p class="nudge" id="nudge" aria-live="assertive"></p>
  </section>

  <!-- a clickable history of the steps; returning users can skip ahead -->
  <nav id="timeline" class="timeline" aria-label="lesson steps"></nav>

  <script type="module" src="app.js?v=editor14"></script>
</body>
</html>
