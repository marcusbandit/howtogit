<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>howtogit: git and GitHub, explained by doing</title>
  <meta name="description" content="Learn how git and GitHub work by doing it: save versions, go back in time, share with a friend, open a pull request. With buttons, commands or an AI assistant." />
  <meta name="color-scheme" content="light dark" />
  <!-- cached forever on purpose: a hard refresh is the only thing that re-downloads it,
       which is how the page tells Ctrl+Shift+R (start fresh) from a normal reload -->
  <script src="reload-probe.js"></script>
  <script>
    (function () {
      var KEY = 'htg-theme', root = document.documentElement, saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = saved || (dark ? 'dark' : 'light');
      document.addEventListener('DOMContentLoaded', function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        function sync() { var d = root.dataset.theme === 'dark'; btn.setAttribute('aria-pressed', String(d)); btn.title = d ? 'Switch to light' : 'Switch to dark'; }
        sync();
        btn.addEventListener('click', function () {
          root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          try { localStorage.setItem(KEY, root.dataset.theme); } catch (e) {}
          sync();
        });
      });
    })();
  </script>
  <meta property="og:title" content="howtogit: git and GitHub, explained by doing" />
  <meta property="og:description" content="Save versions, go back in time, share with a friend, open a pull request. No experience needed." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://howtogit.dev/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Hanken+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=story77" />
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="howtogit home">howtogit<span>.dev</span></a>
    <nav class="chapters" id="chapters" aria-label="chapters"></nav>
    <button type="button" class="chap-pill" id="chap-pill" aria-haspopup="dialog" aria-label="chapters"></button>
    <div class="top__right">
      <button type="button" class="deck-btn" id="deck-btn" aria-label="your git words"></button>
      <div class="mode" id="mode" role="radiogroup" aria-label="how you want to do things">
        <span class="mode__label">Do it with</span>
        <button type="button" role="radio" data-mode="buttons">Buttons</button>
        <button type="button" role="radio" data-mode="command">Commands</button>
        <button type="button" role="radio" data-mode="ai">An AI</button>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V17h5.2v-1.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/><path d="M9.6 19.5h4.8M10.4 21.5h3.2"/></svg>
      </button>
      <button type="button" class="menu-btn" id="menu-btn" aria-haspopup="dialog" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <section class="intro" id="intro" hidden aria-label="welcome"></section>
  <main class="app">
    <section class="lesson" id="lesson" aria-live="polite"></section>
    <section class="world" id="world" aria-label="your computer, GitHub and Albert's computer"></section>
  </main>

  <dialog class="editor" id="editor" aria-labelledby="editor-title">
    <form method="dialog" class="editor__inner">
      <header class="editor__head">
        <div>
          <p class="editor__where" id="editor-where"></p>
          <h2 class="editor__title" id="editor-title">pancakes.md</h2>
        </div>
        <button class="editor__x" value="cancel" aria-label="Close">✕</button>
      </header>
      <div class="editor__tabs" id="editor-tabs"></div>
      <div class="resolver" id="resolver" hidden></div>
      <textarea id="editor-text" spellcheck="true" lang="en" autocapitalize="off" autocomplete="off" rows="3"></textarea>
      <p class="editor__note" id="editor-note"></p>
      <footer class="editor__foot">
        <button class="btn btn--ghost" value="cancel">Cancel</button>
        <button class="btn" id="editor-save" value="save">Save file</button>
      </footer>
    </form>
  </dialog>

  <dialog class="deck" id="deck" aria-labelledby="deck-title">
    <form method="dialog" class="deck__inner">
      <header class="editor__head"><h2 id="deck-title" class="deck__title">Your git words</h2><button class="editor__x" value="close" aria-label="Close">✕</button></header>
      <p class="deck__sub">Every word you earn by doing it. The rest are still ahead.</p>
      <ul class="deck__list" id="deck-list"></ul>
    </form>
  </dialog>
  <dialog class="sheet" id="chap-sheet" aria-labelledby="chap-sheet-title">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head"><h2 id="chap-sheet-title" class="sheet__title">Chapters</h2><button class="editor__x" value="close" aria-label="Close">✕</button></header>
      <ol class="sheet__chaps" id="chap-list"></ol>
    </form>
  </dialog>

  <dialog class="sheet" id="menu" aria-labelledby="menu-title">
    <form method="dialog" class="sheet__inner">
      <header class="sheet__head"><h2 id="menu-title" class="sheet__title">howtogit<span>.dev</span></h2><button class="editor__x" value="close" aria-label="Close">✕</button></header>
      <p class="sheet__label" id="menu-mode-label">Do it with</p>
      <div class="sheet__modes mode-pick" role="radiogroup" aria-labelledby="menu-mode-label">
        <button type="button" role="radio" data-mode="buttons"><b>Buttons</b><span>Click, like in VS Code</span></button>
        <button type="button" role="radio" data-mode="command"><b>Commands</b><span>Type real git commands</span></button>
        <button type="button" role="radio" data-mode="ai"><b>An AI</b><span>Ask in plain words</span></button>
      </div>
      <button type="button" class="sheet__row" id="menu-theme"><span>Dark mode</span><span class="switch" aria-hidden="true"></span></button>
      <button type="button" class="sheet__row" id="menu-intro"><span>Watch the intro again</span><span aria-hidden="true">→</span></button>
    </form>
  </dialog>
  <div class="xp" id="xp" role="dialog" aria-label="what this command means" hidden>
    <button type="button" class="xp__x" aria-label="Close">✕</button>
    <div class="xp__body"></div>
  </div>
  <button type="button" class="back-up" id="back-up" hidden><span aria-hidden="true">↑</span> Read what happened</button>
  <div class="fx" id="fx" aria-hidden="true"></div>
  <script type="module" src="main.js?v=story77"></script>
</body>
</html>
